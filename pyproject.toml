[project]
name = "structct"
version = "1.0.0"
description = "Offline inference and data artifact for structured clinical-trial matching"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Research artifact; see LICENSE.md" }
dependencies = [
    "numpy>=1.26,<3",
    "pyarrow>=15,<22",
    "pydantic>=2.6,<3",
    "sentence-transformers>=3.0,<6",
    "torch>=2.4,<3",
    "torch-geometric>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[project.scripts]
structct = "structct.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/structct"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
